<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard - CampusConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="../index.html">

            📚 CampusConnect

        </a>

        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#nav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
             id="nav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link active"
                       href="dashboard.html">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="library.html">
                        Library
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="marketplace.html">
                        Book Exchange
                    </a>
                </li>

                <li class="nav-item">
                    <button class="btn btn-light btn-sm mt-1"
                            onclick="logout()">
                        Logout
                    </button>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- HEADER -->

<section class="dashboard-header">

    <div class="container">

        <h2>
            Welcome, <span id="studentName">Student</span> 👋
        </h2>

        <p class="mb-0">
            Manage your books and library activities.
        </p>

    </div>

</section>


<!-- CONTENT -->

<div class="container my-5">


    <!-- PROFILE -->

    <div class="card border-0 shadow-sm mb-4">

        <div class="card-body">

            <div class="d-flex align-items-center">

                <img id="profileImage"
                     class="profile-img me-3"
                     src="https://via.placeholder.com/70">

                <div>

                    <h5 id="profileName">
                        Loading...
                    </h5>

                    <p class="mb-0 text-muted"
                       id="profileEmail">
                    </p>

                    <small id="profileDetails">
                    </small>

                </div>

            </div>

        </div>

    </div>


    <!-- STATISTICS -->

    <div class="row g-4">


        <div class="col-md-3">

            <div class="stat-card">

                <p class="text-muted">
                    Library Books
                </p>

                <div class="stat-number"
                     id="libraryCount">

                    0

                </div>

            </div>

        </div>


        <div class="col-md-3">

            <div class="stat-card">

                <p class="text-muted">
                    My Listed Books
                </p>

                <div class="stat-number"
                     id="listedCount">

                    0

                </div>

            </div>

        </div>


        <div class="col-md-3">

            <div class="stat-card">

                <p class="text-muted">
                    Borrowed Books
                </p>

                <div class="stat-number"
                     id="borrowedCount">

                    0

                </div>

            </div>

        </div>


        <div class="col-md-3">

            <div class="stat-card">

                <p class="text-muted">
                    Pending Requests
                </p>

                <div class="stat-number"
                     id="requestCount">

                    0

                </div>

            </div>

        </div>

    </div>


    <!-- QUICK ACTIONS -->

    <div class="mt-5">

        <h4 class="mb-4">
            Quick Actions
        </h4>

        <div class="row g-3">

            <div class="col-md-4">

                <a href="library.html"
                   class="btn btn-primary w-100 p-3">

                    📚 Browse Library

                </a>

            </div>

            <div class="col-md-4">

                <a href="marketplace.html"
                   class="btn btn-success w-100 p-3">

                    🔄 Exchange Books

                </a>

            </div>

            <div class="col-md-4">

                <a href="add-book.html"
                   class="btn btn-warning w-100 p-3">

                    ➕ List My Book

                </a>

            </div>

        </div>

    </div>


</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script src="../js/firebase-config.js"></script>


<script>

auth.onAuthStateChanged(async function(user) {

    if (!user) {

        window.location.href =
            "login.html";

        return;

    }


    const userDoc =
        await db
            .collection("users")
            .doc(user.uid)
            .get();


    if (!userDoc.exists) {

        window.location.href =
            "login.html";

        return;

    }


    const data =
        userDoc.data();


    document
        .getElementById("studentName")
        .innerText =
        data.name || "Student";


    document
        .getElementById("profileName")
        .innerText =
        data.name || "Student";


    document
        .getElementById("profileEmail")
        .innerText =
        data.email || "";


    document
        .getElementById("profileDetails")
        .innerText =
        `${data.rollNo || ""} • ${data.department || ""} • ${data.year || ""}`;


    if (data.photoURL) {

        document
            .getElementById("profileImage")
            .src =
            data.photoURL;

    }


    loadDashboardData(user.uid);

});


async function loadDashboardData(uid) {

    try {

        const library =
            await db
                .collection("libraryBooks")
                .where("available", "==", true)
                .get();


        document
            .getElementById("libraryCount")
            .innerText =
            library.size;


        const myBooks =
            await db
                .collection("exchangeBooks")
                .where("ownerId", "==", uid)
                .get();


        document
            .getElementById("listedCount")
            .innerText =
            myBooks.size;


        const borrowed =
            await db
                .collection("borrowRecords")
                .where("borrowerId", "==", uid)
                .where("status", "==", "active")
                .get();


        document
            .getElementById("borrowedCount")
            .innerText =
            borrowed.size;


        const requests =
            await db
                .collection("exchangeRequests")
                .where("ownerId", "==", uid)
                .where("status", "==", "pending")
                .get();


        document
            .getElementById("requestCount")
            .innerText =
            requests.size;

    }

    catch(error) {

        console.error(error);

    }

}


function logout() {

    auth.signOut()
        .then(() => {

            window.location.href =
                "login.html";

        });

}

</script>


</body>

</html>
