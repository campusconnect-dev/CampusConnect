<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Librarian Dashboard - CampusConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="../js/firebase-config.js"></script>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">
            CampusConnect - Librarian
        </span>

        <button class="btn btn-outline-light btn-sm" onclick="logout()">
            Logout
        </button>
    </div>
</nav>


<div class="container py-4">

    <h2 class="mb-4">Librarian Dashboard</h2>

    <!-- ACCESS / LOADING -->
    <div id="loading" class="alert alert-info">
        Checking librarian access...
    </div>

    <div id="dashboard" style="display:none;">

        <!-- ================= VISITORS ================= -->

        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Students Currently Inside Library</h5>
            </div>

            <div class="card-body">

                <div id="visitorsList">
                    Loading...
                </div>

            </div>
        </div>


        <!-- ================= BOOK REQUESTS ================= -->

        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Book Requests / Borrowed Books</h5>
            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered">

                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Book</th>
                                <th>Borrowed At</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="borrowRecordsList">
                            <tr>
                                <td colspan="5">Loading...</td>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </div>
        </div>


        <!-- ================= LIBRARY BOOKS ================= -->

        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Library Books</h5>
            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered">

                        <thead>
                            <tr>
                                <th>Book</th>
                                <th>Author</th>
                                <th>Category</th>
                                <th>ISBN</th>
                                <th>Availability</th>
                            </tr>
                        </thead>

                        <tbody id="booksList">
                            <tr>
                                <td colspan="5">Loading...</td>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </div>
        </div>


        <!-- ================= LOST & FOUND ================= -->

        <div class="card shadow-sm mb-4">

            <div class="card-header">
                <h5 class="mb-0">Lost & Found Reports</h5>
            </div>

            <div class="card-body">

                <div id="lostFoundList">
                    Loading...
                </div>

            </div>
        </div>

    </div>

</div>

<script>
    /* =========================
       LOGIN + ROLE CHECK
    ========================= */

    firebase.auth().onAuthStateChanged(async function(user) {

        if (!user) {

            window.location.href = "login.html";

            return;
        }

        currentUser = user;

        try {

            const userDoc =
                await db.collection("users")
                        .doc(user.uid)
                        .get();

            if (!userDoc.exists) {

                document.getElementById("loading").innerHTML =
                    "User profile not found.";

                return;
            }

            const userData = userDoc.data();

            if (userData.role !== "librarian") {

                document.getElementById("loading").className =
                    "alert alert-danger";

                document.getElementById("loading").innerHTML =
                    "Access Denied. Librarian access required.";

                setTimeout(function() {

                    window.location.href = "dashboard.html";

                }, 2000);

                return;
            }


            document.getElementById("loading").style.display = "none";

            document.getElementById("dashboard").style.display = "block";


            loadVisitors();
            loadBorrowRecords();
            loadBooks();
            loadLostFound();

        }

        catch(error) {

            console.error(error);

            document.getElementById("loading").className =
                "alert alert-danger";

            document.getElementById("loading").innerHTML =
                "Error checking access: " + error.message;

        }

    });


    /* =========================
       LIBRARY VISITORS
    ========================= */

    async function loadVisitors() {

        const container =
            document.getElementById("visitorsList");

        try {

            const snapshot =
                await db.collection("libraryVisits")
                        .where("status", "==", "Inside")
                        .get();

            if (snapshot.empty) {

                container.innerHTML =
                    "<p class='text-muted'>No students are currently inside the library.</p>";

                return;
            }

            let html = "";

            snapshot.forEach(function(doc) {

                const data = doc.data();

                let punchIn = "Not available";

                if (data.punchIn) {

                    punchIn =
                        data.punchIn.toDate().toLocaleString();

                }

                html += `
                    <div class="border rounded p-3 mb-2">

                        <strong>${data.studentName || "Student"}</strong>

                        <br>

                        <small>
    Roll No: ${data.studentRollNo || "Not available"}
</small>

<small>
    Department: ${data.studentDepartment || "Not available"}
</small>

<br>

<small>
    Academic Year: ${data.studentYear || "Not available"}
</small>

<br><small>
    Department: ${data.studentDepartment || "Not available"}
</small>

<br>

<small>
    Academic Year: ${data.studentYear || "Not available"}
</small>

<br>

<br>

<small>
    ${data.studentEmail || ""}

</small>

<br>

<span class="badge bg-success mt-2">

                        <span class="ms-2">
                            Punch In: ${punchIn}
                        </span>

                    </div>
                `;

            });

            container.innerHTML = html;

        }

        catch(error) {

            console.error(error);

            container.innerHTML =
                "<p class='text-danger'>Unable to load visitors.</p>";

        }

    }


    /* =========================
       BORROW RECORDS
    ========================= */

    async function loadBorrowRecords() {

    const tbody =
        document.getElementById("borrowRecordsList");

    try {

        const snapshot =
            await db.collection("borrowRecords")
                .get();

        if (snapshot.empty) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="5">
                        No book requests found.
                    </td>
                </tr>
            `;

            return;
        }

        let html = "";

        snapshot.forEach(function(doc) {

            const data = doc.data();

            let requestedAt = "Not available";

            if (data.requestedAt) {

                requestedAt =
                    data.requestedAt.toDate().toLocaleString();

            }
            else if (data.borrowedAt) {

                requestedAt =
                    data.borrowedAt.toDate().toLocaleString();

            }

            let statusBadge = "";
            let actionButton = "";

            // PENDING REQUEST
            if (data.status === "pending") {

                statusBadge =
                    '<span class="badge bg-info text-dark">Pending</span>';

                actionButton = `
                    <button
                        class="btn btn-sm btn-primary"
                        onclick="issueBook('${doc.id}', '${data.bookId}')"
                    >
                        Issue Book
                    </button>
                `;
            }

            // ACTIVE / BORROWED
            else if (data.status === "active") {

                statusBadge =
                    '<span class="badge bg-warning text-dark">Borrowed</span>';

                actionButton = `
                    <button
                        class="btn btn-sm btn-success"
                        onclick="returnBook('${doc.id}', '${data.bookId}')"
                    >
                        Return Book
                    </button>
                `;
            }

            // RETURNED
            else {

                statusBadge =
                    '<span class="badge bg-success">Returned</span>';

                actionButton =
                    '<span class="text-muted">Completed</span>';
            }

            html += `
                <tr>

                    <td>
                        ${data.borrowerName || "Student"}
                    </td>

                    <td>
                        ${data.bookTitle || "Book"}
                    </td>

                    <td>
                        ${requestedAt}
                    </td>

                    <td>
                        ${statusBadge}
                    </td>

                    <td>
                        ${actionButton}
                    </td>

                </tr>
            `;

        });

        tbody.innerHTML = html;

    }

    catch(error) {

        console.error(error);

        tbody.innerHTML = `
            <tr>
                <td colspan="5" class="text-danger">
                    Unable to load book requests.
                </td>
            </tr>
        `;

    }

}

/* =========================
   MARKETPLACE REQUESTS
========================= */

async function loadExchangeRequests() {

    const tbody =
        document.getElementById("exchangeRequestsList");

    try {

        const snapshot =
            await db.collection("exchangeRequests")
                    .get();

        if (snapshot.empty) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="5">
                        No marketplace requests found.
                    </td>
                </tr>
            `;

            return;
        }

        let html = "";

        snapshot.forEach(function(doc) {

            const data = doc.data();

            html += `
                <tr>

                    <td>
                        ${data.requesterName || "Student"}
                    </td>

                    <td>
                        ${data.bookTitle || "Book"}
                    </td>

                    <td>
                        ${data.ownerName || "Owner"}
                    </td>

                    <td>
                        ${
                            data.status === "pending"
                            ? '<span class="badge bg-warning text-dark">Pending</span>'
                            : `<span class="badge bg-secondary">${data.status}</span>`
                        }
                    </td>

                    <td>

                        ${
                            data.status === "pending"

                            ? `
                                <button
                                    class="btn btn-sm btn-success"
                                    onclick="approveExchangeRequest('${doc.id}')"
                                >
                                    Approve
                                </button>

                                <button
                                    class="btn btn-sm btn-danger"
                                    onclick="rejectExchangeRequest('${doc.id}')"
                                >
                                    Reject
                                </button>
                              `

                            : `
                                <span class="text-muted">
                                    Completed
                                </span>
                              `
                        }

                    </td>

                </tr>
            `;
        });

        tbody.innerHTML = html;

    }

    catch(error) {

        console.error(error);

        tbody.innerHTML = `
            <tr>
                <td colspan="5" class="text-danger">
                    Unable to load marketplace requests.
                </td>
            </tr>
        `;
    }
}

async function approveExchangeRequest(requestId) {

    if (!confirm("Approve this book request?")) {
        return;
    }

    try {

        await db.collection("exchangeRequests")
                .doc(requestId)
                .update({
                    status: "approved",
                    approvedAt:
                        firebase.firestore.FieldValue.serverTimestamp(),
                    approvedBy: currentUser.uid
                });

        alert("Book request approved.");

        loadExchangeRequests();

    }

    catch(error) {

        console.error(error);

        alert(
            "Unable to approve request: " +
            error.message
        );
    }
}


async function rejectExchangeRequest(requestId) {

    if (!confirm("Reject this book request?")) {
        return;
    }

    try {

        await db.collection("exchangeRequests")
                .doc(requestId)
                .update({
                    status: "rejected",
                    rejectedAt:
                        firebase.firestore.FieldValue.serverTimestamp(),
                    rejectedBy: currentUser.uid
                });

        alert("Book request rejected.");

        loadExchangeRequests();

    }

    catch(error) {

        console.error(error);

        alert(
            "Unable to reject request: " +
            error.message
        );
    }
}

/* =========================
   ISSUE BOOK
========================= */

async function issueBook(recordId, bookId) {

    if (!confirm("Issue this book to the student?")) {
        return;
    }

    try {

        const bookRef =
            db.collection("libraryBooks").doc(bookId);

        const bookDoc =
            await bookRef.get();

        if (!bookDoc.exists) {

            alert("Book does not exist.");

            return;
        }

        const book = bookDoc.data();

        if (!book.available) {

            alert("This book is already unavailable.");

            return;
        }

        // Get borrow record
        const recordRef =
            db.collection("borrowRecords").doc(recordId);

        const recordDoc =
            await recordRef.get();

        if (!recordDoc.exists) {

            alert("Borrow record does not exist.");

            return;
        }

        const record = recordDoc.data();

        // Update borrow record
        await recordRef.update({

            status: "active",

            borrowedAt:
                firebase.firestore.FieldValue.serverTimestamp()

        });

        // Mark book as unavailable
        await bookRef.update({

            available: false,

            borrowedBy: record.borrowerId

        });

        alert("Book issued successfully.");

        loadBorrowRecords();

        loadBooks();

    }

    catch(error) {

        console.error(error);

        alert(
            "Unable to issue book: " +
            error.message
        );

    }

}


    /* =========================
       RETURN BOOK
    ========================= */

    async function returnBook(recordId, bookId) {

        if (!confirm("Mark this book as returned?")) {

            return;

        }

        try {

            await db.collection("borrowRecords")
                    .doc(recordId)
                    .update({

                        status: "returned",

                        returnedAt:
                            firebase.firestore.FieldValue.serverTimestamp()

                    });


            await db.collection("libraryBooks")
                    .doc(bookId)
                    .update({

                        available: true,

                        borrowedBy: null

                    });


            alert("Book returned successfully.");

            loadBorrowRecords();

            loadBooks();

        }

        catch(error) {

            console.error(error);

            alert(
                "Unable to return book: " +
                error.message
            );

        }

    }

  

    /* =========================
       LIBRARY BOOKS
    ========================= */

    async function loadBooks() {

        const tbody =
            document.getElementById("booksList");

        try {

            const snapshot =
                await db.collection("libraryBooks")
                        .get();

            if (snapshot.empty) {

                tbody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            No books found.
                        </td>
                    </tr>
                `;

                return;
            }

            let html = "";

            snapshot.forEach(function(doc) {

                const data = doc.data();

                html += `
                    <tr>

                        <td>
                            ${data.title || "-"}
                        </td>

                        <td>
                            ${data.author || "-"}
                        </td>

                        <td>
                            ${data.category || "-"}
                        </td>

                        <td>
                            ${data.isbn || "-"}
                        </td>

                        <td>

                            ${
                                data.available
                                ?
                                '<span class="badge bg-success">Available</span>'
                                :
                                '<span class="badge bg-danger">Borrowed</span>'
                            }

                        </td>

                    </tr>
                `;

            });

            tbody.innerHTML = html;

        }

        catch(error) {

            console.error(error);

            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-danger">
                        Unable to load books.
                    </td>
                </tr>
            `;

        }

    }


    /* =========================
       LOST & FOUND
    ========================= */

    async function loadLostFound() {

        const container =
            document.getElementById("lostFoundList");

        try {

            const snapshot =
                await db.collection("lost_found_items")
                        .get();

            if (snapshot.empty) {

                container.innerHTML =
                    "<p class='text-muted'>No Lost & Found reports.</p>";

                return;
            }

            let html = "";

            snapshot.forEach(function(doc) {

                const data = doc.data();

                const typeClass =
                    data.type === "Lost"
                    ? "danger"
                    : "success";

                html += `

                    <div class="border rounded p-3 mb-3">

                        <div class="d-flex justify-content-between">

                            <h6>
                                ${data.itemName || "Item"}
                            </h6>

                            <span class="badge bg-${typeClass}">
                                ${data.type || ""}
                            </span>

                        </div>

                        <p class="mb-1">
                            ${data.description || ""}
                        </p>

                        <p class="mb-2">
                            <strong>Location:</strong>
                            ${data.location || "-"}
                        </p>

                        <p>
                            <strong>Status:</strong>
                            ${data.status || "Open"}
                        </p>

                        ${
                            data.status === "Open"
                            ?
                            `<button
                                class="btn btn-sm btn-success"
                                onclick="resolveLostFound('${doc.id}')"
                            >
                                Mark Resolved
                            </button>`
                            :
                            '<span class="text-success">Resolved</span>'
                        }

                    </div>

                `;

            });

            container.innerHTML = html;

        }

        catch(error) {

            console.error(error);

            container.innerHTML =
                "<p class='text-danger'>Unable to load Lost & Found reports.</p>";

        }

    }


    /* =========================
       RESOLVE LOST & FOUND
    ========================= */

    async function resolveLostFound(itemId) {

        if (!confirm("Mark this item as resolved?")) {

            return;

        }

        try {

            await db.collection("lost_found_items")
                    .doc(itemId)
                    .update({

                        status: "Resolved",

                        resolvedAt:
                            firebase.firestore.FieldValue.serverTimestamp(),

                        resolvedBy:
                            currentUser.uid

                    });

            alert("Item marked as resolved.");

            loadLostFound();

        }

        catch(error) {

            console.error(error);

            alert(
                "Unable to update item: " +
                error.message
            );

        }

    }


    /* =========================
       LOGOUT
    ========================= */

    function logout() {

        firebase.auth()
            .signOut()
            .then(function() {

                window.location.href = "login.html";

            });

    }

</script>

</body>
</html>
