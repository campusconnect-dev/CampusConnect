<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Library - CampusConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="../index.html">

            <i class="bi bi-book"></i> CampusConnect

        </a>

        <div>

            <a href="dashboard.html"
               class="btn btn-light btn-sm">

                Dashboard

            </a>

        </div>

    </div>

</nav>


<div class="container my-5">


    <!-- PAGE TITLE -->

    <div class="text-center mb-5">

        <h1>
            <i class="bi bi-book"></i> Smart Library
        </h1>

        <p class="text-muted">
            Manage library entry and search available books
        </p>

    </div>


    <!-- LIBRARY PUNCH SECTION -->

    <div class="card shadow-sm border-0 mb-5">

        <div class="card-body text-center p-4">

            <h3 class="text-primary">
                Library Attendance
            </h3>

            <p class="text-muted">
                Record your library entry and exit
            </p>


            <div class="mb-3">

                <span id="visitStatus"
                      class="badge bg-secondary">

                    Checking status...

                </span>

            </div>


            <button id="punchInBtn"
                    class="btn btn-success me-2"
                    onclick="punchIn()">

                Punch In

            </button>


            <button id="punchOutBtn"
                    class="btn btn-danger"
                    onclick="punchOut()"
                    disabled>

                Punch Out

            </button>


            <p id="visitMessage"
               class="mt-3 mb-0 text-muted">

            </p>

        </div>

    </div>


    <!-- SEARCH BOOKS -->

    <div class="row mb-4">

        <div class="col-md-8 mx-auto">

            <input
                type="text"
                id="searchInput"
                class="form-control form-control-lg"
                placeholder="Search by title, author or subject..."
                onkeyup="filterBooks()">

        </div>

    </div>


    <!-- BOOKS -->

    <div class="row g-4"
         id="booksContainer">

        <div class="text-center">
            Loading books...
        </div>

    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script src="../js/firebase-config.js"></script>


<script>

let allBooks = [];

let currentUser = null;

let activeVisitId = null;


/* =========================
   AUTHENTICATION
========================= */

auth.onAuthStateChanged(function(user) {

    currentUser = user;

    if (!user) {

        document.getElementById("visitStatus").textContent =
            "Not Logged In";

        document.getElementById("visitStatus").className =
            "badge bg-secondary";

        document.getElementById("punchInBtn").disabled = true;

        document.getElementById("punchOutBtn").disabled = true;

        return;

    }

    checkActiveVisit();

});


/* =========================
   CHECK ACTIVE VISIT
========================= */

async function checkActiveVisit() {

    if (!currentUser) {
        return;
    }

    try {

        const snapshot = await db
            .collection("libraryVisits")
            .where("studentId", "==", currentUser.uid)
            .where("status", "==", "Inside")
            .limit(1)
            .get();


        if (!snapshot.empty) {

            activeVisitId = snapshot.docs[0].id;

            document.getElementById("visitStatus").textContent =
                "Currently Inside Library";

            document.getElementById("visitStatus").className =
                "badge bg-success";

            document.getElementById("punchInBtn").disabled = true;

            document.getElementById("punchOutBtn").disabled = false;

            document.getElementById("visitMessage").textContent =
                "You have already punched in.";

        }

        else {

            activeVisitId = null;

            document.getElementById("visitStatus").textContent =
                "Not Inside Library";

            document.getElementById("visitStatus").className =
                "badge bg-secondary";

            document.getElementById("punchInBtn").disabled = false;

            document.getElementById("punchOutBtn").disabled = true;

            document.getElementById("visitMessage").textContent =
                "You can punch in when you enter the library.";

        }

    }

    catch(error) {

        console.error(error);

        document.getElementById("visitMessage").textContent =
            "Unable to check library status.";

    }

}


/* =========================
   PUNCH IN
========================= */

async function punchIn() {

    if (!currentUser) {

        alert("Please login first.");

        window.location.href = "login.html";

        return;
    }

    try {

        const existingVisit = await db
            .collection("libraryVisits")
            .where("studentId", "==", currentUser.uid)
            .where("status", "==", "Inside")
            .limit(1)
            .get();

        if (!existingVisit.empty) {

            alert("You are already inside the library.");

            checkActiveVisit();

            return;
        }

        // Get student's profile
        const userDoc = await db
            .collection("users")
            .doc(currentUser.uid)
            .get();

        let studentRollNo = "";
let studentDepartment = "";
let studentYear = "";

if (userDoc.exists) {
    const userData = userDoc.data();

    studentRollNo = userData.rollNo || "";
    studentDepartment = userData.department || "";
    studentYear = userData.year || "";
}

        // Roll number is required for library attendance
        if (!studentRollNo) {

            alert(
                "Roll Number not found in your profile. Please complete your student profile first."
            );

            return;
        }

        // Create library visit
        const visitRef = await db.collection("libraryVisits").add({

            studentId: currentUser.uid,
            studentName: currentUser.displayName || "Student",
            studentEmail: currentUser.email || "",
            studentRollNo: studentRollNo,
            studentDepartment: studentDepartment,
            studentYear: studentYear,

            punchIn:
                firebase.firestore.FieldValue.serverTimestamp(),

            punchOut: null,

            status: "Inside"

        });

        activeVisitId = visitRef.id;

        alert("Library Punch In successful!");

        checkActiveVisit();

    }

    catch(error) {

        console.error(error);

        alert(
            "Unable to Punch In: " +
            error.message
        );

    }

}

/* =========================
   PUNCH OUT
========================= */

async function punchOut() {

    if (!currentUser) {

        alert("Please login first.");

        return;

    }


    if (!activeVisitId) {

        alert("No active library visit found.");

        return;

    }


    try {

        await db
            .collection("libraryVisits")
            .doc(activeVisitId)
            .update({

                punchOut:
                    firebase.firestore.FieldValue.serverTimestamp(),

                status: "Completed"

            });


        activeVisitId = null;


        alert("Library Punch Out successful!");


        checkActiveVisit();

    }

    catch(error) {

        console.error(error);

        alert(
            "Unable to Punch Out: " +
            error.message
        );

    }

}


/* =========================
   LOAD BOOKS
========================= */

async function loadBooks() {

    try {

        const snapshot =
            await db
                .collection("libraryBooks")
                .get();


        allBooks = [];

        snapshot.forEach(doc => {

            allBooks.push({

                id: doc.id,

                ...doc.data()

            });

        });


        displayBooks(allBooks);

    }

    catch(error) {

        console.error(error);

        document
            .getElementById("booksContainer")
            .innerHTML = `
                <div class="alert alert-danger">
                    Unable to load books.
                </div>
            `;

    }

}


/* =========================
   DISPLAY BOOKS
========================= */

function displayBooks(books) {

    const container =
        document.getElementById("booksContainer");


    if (books.length === 0) {

        container.innerHTML = `
            <div class="text-center">
                <h5>No books found.</h5>
            </div>
        `;

        return;

    }


    container.innerHTML = "";


    books.forEach(book => {

        const available =
            book.available === true;


        container.innerHTML += `

            <div class="col-md-4">

                <div class="book-card">

                    <div class="book-icon">
                        <i class="bi bi-journal-bookmark"></i>
                    </div>

                    <h5 class="book-title">
                        ${book.title || "Unknown"}
                    </h5>

                    <p class="book-author">
                        By ${book.author || "Unknown"}
                    </p>

                    <p>
                        <strong>Category:</strong>
                        ${book.category || "General"}
                    </p>

                    <p>
                        <strong>ISBN:</strong>
                        ${book.isbn || "N/A"}
                    </p>

                    <p class="${
                        available
                        ? "status-available"
                        : "status-borrowed"
                    }">

                        ${
                            available
                            ? "● Available"
                            : "● Currently Borrowed"
                        }

                    </p>

                    ${
                        available
                        ?
                        `<button
                            class="btn btn-primary w-100"
                            onclick="borrowBook('${book.id}')">

                            Request Book

                        </button>`
                        :
                        `<button
                            class="btn btn-secondary w-100"
                            disabled>

                            Not Available

                        </button>`
                    }

                </div>

            </div>

        `;

    });

}


/* =========================
   SEARCH BOOKS
========================= */

function filterBooks() {

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase();


    const filtered =
        allBooks.filter(book =>

            (book.title || "")
                .toLowerCase()
                .includes(search)

            ||

            (book.author || "")
                .toLowerCase()
                .includes(search)

            ||

            (book.category || "")
                .toLowerCase()
                .includes(search)

        );


    displayBooks(filtered);

}

/* =========================
   REQUEST BOOK
========================= */

async function borrowBook(bookId) {

    const user = auth.currentUser;

    if (!user) {

        alert("Please login first.");

        window.location.href = "login.html";

        return;
    }

    try {

        const bookRef =
            db.collection("libraryBooks").doc(bookId);

        const bookDoc =
            await bookRef.get();

        if (!bookDoc.exists) {

            alert("Book does not exist.");

            return;
        }

        const book = bookDoc.data();

        if (!book.available) {

            alert("This book is currently unavailable.");

            return;
        }

        // Check whether this student already requested this book
        const existingRequest =
            await db
                .collection("borrowRecords")
                .where("bookId", "==", bookId)
                .where("borrowerId", "==", user.uid)
                .where("status", "==", "pending")
                .get();

        if (!existingRequest.empty) {

            alert("You have already requested this book.");

            return;
        }

        // Create pending request
        await db.collection("borrowRecords").add({

            bookId: bookId,

            bookTitle: book.title,

            borrowerId: user.uid,

            borrowerName:
                user.displayName || "Student",

            requestedAt:
                firebase.firestore.FieldValue.serverTimestamp(),

            borrowedAt: null,

            returnedAt: null,

            status: "pending"

        });

        alert(
            "Book request submitted successfully. Please wait for librarian approval."
        );

        loadBooks();

    }

    catch(error) {

        console.error(error);

        alert(
            "Unable to request book: " +
            error.message
        );

    }

}

/* =========================
   START
========================= */

loadBooks();

</script>


</body>

</html>
