<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Library - CampusConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>


<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="../index.html">

            📚 CampusConnect

        </a>

        <div>

            <a href="dashboard.html"
               class="btn btn-light btn-sm">

                Dashboard

            </a>

        </div>

    </div>

</nav>


<div class="container my-5">

    <div class="text-center mb-5">

        <h1>
            📚 Smart Library
        </h1>

        <p class="text-muted">
            Search books available in the college library
        </p>

    </div>


    <!-- SEARCH -->

    <div class="row mb-4">

        <div class="col-md-8 mx-auto">

            <input
                type="text"
                id="searchInput"
                class="form-control form-control-lg"
                placeholder="Search by title, author or subject..."
                onkeyup="filterBooks()">

        </div>

    </div>


    <!-- BOOKS -->

    <div class="row g-4"
         id="booksContainer">

        <div class="text-center">
            Loading books...
        </div>

    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script src="../js/firebase-config.js"></script>


<script>

let allBooks = [];


/* LOAD BOOKS */

async function loadBooks() {

    try {

        const snapshot =
            await db
                .collection("libraryBooks")
                .get();


        allBooks = [];

        snapshot.forEach(doc => {

            allBooks.push({

                id: doc.id,

                ...doc.data()

            });

        });


        displayBooks(allBooks);

    }

    catch(error) {

        console.error(error);

        document
            .getElementById("booksContainer")
            .innerHTML = `
                <div class="alert alert-danger">
                    Unable to load books.
                </div>
            `;

    }

}


/* DISPLAY */

function displayBooks(books) {

    const container =
        document.getElementById("booksContainer");


    if (books.length === 0) {

        container.innerHTML = `
            <div class="text-center">
                <h5>No books found.</h5>
            </div>
        `;

        return;

    }


    container.innerHTML = "";


    books.forEach(book => {

        const available =
            book.available === true;


        container.innerHTML += `

            <div class="col-md-4">

                <div class="book-card">

                    <div class="book-icon">
                        📖
                    </div>

                    <h5 class="book-title">
                        ${book.title || "Unknown"}
                    </h5>

                    <p class="book-author">
                        By ${book.author || "Unknown"}
                    </p>

                    <p>
                        <strong>Category:</strong>
                        ${book.category || "General"}
                    </p>

                    <p>
                        <strong>ISBN:</strong>
                        ${book.isbn || "N/A"}
                    </p>

                    <p class="${
                        available
                        ? "status-available"
                        : "status-borrowed"
                    }">

                        ${
                            available
                            ? "● Available"
                            : "● Currently Borrowed"
                        }

                    </p>

                    ${
                        available
                        ?
                        `<button
                            class="btn btn-primary w-100"
                            onclick="borrowBook('${book.id}')">

                            Request Book

                        </button>`
                        :
                        `<button
                            class="btn btn-secondary w-100"
                            disabled>

                            Not Available

                        </button>`
                    }

                </div>

            </div>

        `;

    });

}


/* SEARCH */

function filterBooks() {

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase();


    const filtered =
        allBooks.filter(book =>

            (book.title || "")
                .toLowerCase()
                .includes(search)

            ||

            (book.author || "")
                .toLowerCase()
                .includes(search)

            ||

            (book.category || "")
                .toLowerCase()
                .includes(search)

        );


    displayBooks(filtered);

}


/* BORROW */

async function borrowBook(bookId) {

    const user =
        auth.currentUser;


    if (!user) {

        alert("Please login first.");

        window.location.href =
            "login.html";

        return;

    }


    try {

        const bookRef =
            db
                .collection("libraryBooks")
                .doc(bookId);


        const bookDoc =
            await bookRef.get();


        if (!bookDoc.exists) {

            alert("Book does not exist.");

            return;

        }


        const book =
            bookDoc.data();


        if (!book.available) {

            alert("This book is already borrowed.");

            return;

        }


        await db
            .collection("borrowRecords")
            .add({

                bookId: bookId,

                bookTitle: book.title,

                borrowerId: user.uid,

                borrowerName:
                    user.displayName,

                borrowedAt:
                    firebase.firestore.FieldValue.serverTimestamp(),

                status: "active"

            });


        await bookRef.update({

            available: false,

            borrowedBy: user.uid

        });


        alert(
            "Book requested successfully!"
        );


        loadBooks();

    }

    catch(error) {

        console.error(error);

        alert(
            "Unable to request book: " +
            error.message
        );

    }

}


loadBooks();

</script>

</body>

</html>
