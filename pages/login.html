<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusConnect - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef5ff, #ffffff);
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 55px;
            text-align: center;
        }

        .login-title {
            text-align: center;
            font-weight: 700;
        }

        .login-description {
            text-align: center;
            color: #6c757d;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4285F4;
            color: white;
            font-weight: 600;
        }

        .google-btn:hover {
            background: #357ae8;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .profile-modal {
            background: white;
            width: 400px;
            max-width: 90%;
            padding: 30px;
            border-radius: 15px;
        }

    </style>

</head>


<body>


<div class="login-card">

    <div class="logo">
        <i class="bi bi-book"></i>
    </div>

    <h2 class="login-title">
        CampusConnect
    </h2>

    <p class="login-description">
        Smart Library & Student Book Exchange
    </p>

    <button id="googleBtn"
            class="google-btn mt-4"
            onclick="signInWithGoogle()">

        <i class="bi bi-google"></i> Sign in with Google

    </button>

</div>



<!-- PROFILE MODAL -->

<div class="modal-overlay" id="profileModal">

    <div class="profile-modal">

        <h3>
            Complete Your Profile
        </h3>

        <p class="text-muted">
            Enter your college information to continue.
        </p>


        <form id="profileForm">

            <div class="mb-3">

                <label class="form-label">
                    Roll Number / Enrollment Number
                </label>

                <input
                    type="text"
                    id="rollNo"
                    class="form-control"
                    placeholder="Example: 2024IT101"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Department
                </label>

                <select id="department"
                        class="form-select"
                        required>

                    <option value="">
                        Select Department
                    </option>

                    <option value="Information Technology">
                        Information Technology
                    </option>

                    <option value="Computer Science">
                        Computer Science
                    </option>

                    <option value="Commerce">
                        Commerce
                    </option>

                    <option value="Management">
                        Management
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Academic Year
                </label>

                <select id="year"
                        class="form-select"
                        required>

                    <option value="">
                        Select Year
                    </option>

                    <option value="1st Year">
                        1st Year
                    </option>

                    <option value="2nd Year">
                        2nd Year
                    </option>

                    <option value="3rd Year">
                        3rd Year
                    </option>

                    <option value="4th Year">
                        4th Year
                    </option>

                </select>

            </div>


            <button type="submit"
                    class="btn btn-success w-100">

                Save Profile & Continue

            </button>

        </form>

    </div>

</div>



<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script src="../js/firebase-config.js"></script>


<script>

const provider =
    new firebase.auth.GoogleAuthProvider();

provider.setCustomParameters({
    prompt: "select_account"
});


let currentUser = null;


/* GOOGLE LOGIN */

/* AUTHORIZED LIBRARIANS */

const AUTHORIZED_LIBRARIANS = [
    "tabbu.developer@gmail.com",

    // Add more librarian emails here in future:
    // "librarian2@college.com",
    // "librarian3@college.com"
];


/* GOOGLE LOGIN */

async function signInWithGoogle() {

    const button =
        document.getElementById("googleBtn");

    button.disabled = true;

    button.innerText = "Signing in...";


    try {

        const result =
            await auth.signInWithPopup(provider);

        currentUser = result.user;


        const email =
            currentUser.email.toLowerCase();


        /*
         * FIRST CHECK:
         * Is this an authorized librarian?
         */

        if (AUTHORIZED_LIBRARIANS.includes(email)) {

            await db
                .collection("users")
                .doc(currentUser.uid)
                .set({

                    uid: currentUser.uid,

                    name: currentUser.displayName || "Librarian",

                    email: currentUser.email,

                    photoURL: currentUser.photoURL || "",

                    role: "librarian",

                    updatedAt:
                        firebase.firestore.FieldValue.serverTimestamp()

                }, { merge: true });


            window.location.href =
                "librarian-dashboard.html";

            return;
        }


        /*
         * SECOND CHECK:
         * Existing normal student
         */

        const userDoc =
            await db
                .collection("users")
                .doc(currentUser.uid)
                .get();


        if (userDoc.exists) {

            const userData = userDoc.data();


            if (userData.role === "librarian") {

                window.location.href =
                    "librarian-dashboard.html";

            } else {

                window.location.href =
                    "dashboard.html";

            }

        } else {

            /*
             * New non-librarian user
             * gets Student Profile Form
             */

            document
                .getElementById("profileModal")
                .style.display = "flex";

        }

    }

    catch (error) {

        console.error(error);

        alert(
            "Login failed: " +
            error.message
        );

        button.disabled = false;

        button.innerText = "Sign in with Google";

    }

}


/* PROFILE FORM */

document
    .getElementById("profileForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();


        if (!currentUser) {

            alert("Please login first.");

            return;

        }


        const rollNo =
            document
                .getElementById("rollNo")
                .value
                .trim();


        const department =
            document
                .getElementById("department")
                .value;


        const year =
            document
                .getElementById("year")
                .value;


        try {

            const existingRollNo = await db
    .collection("users")
    .where("rollNo", "==", rollNo)
    .get();

if (!existingRollNo.empty) {
    alert("This Roll Number / Enrollment Number is already registered.");
    return;
}

            await db
                .collection("users")
                .doc(currentUser.uid)
                .set({

                    uid: currentUser.uid,

                    name: currentUser.displayName,

                    email: currentUser.email,

                    photoURL: currentUser.photoURL || "",

                    rollNo: rollNo,

                    department: department,

                    year: year,

                    role: "student",

                    createdAt:
                        firebase.firestore.FieldValue.serverTimestamp()

                });


            alert(
                "Profile created successfully!"
            );


            window.location.href =
                "dashboard.html";

        }

        catch(error) {

            console.error(error);

            alert(
                "Unable to create profile: " +
                error.message
            );

        }

    });

</script>


</body>

</html>
