<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>List Book - CampusConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>


<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="../index.html">

            <i class="bi bi-book"></i> CampusConnect

        </a>

        <a href="marketplace.html"
           class="btn btn-light btn-sm">

            Back to Exchange

        </a>

    </div>

</nav>


<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <h3 class="mb-4">
                        <i class="bi bi-journal-plus"></i> Add Book
                    </h3>


                    <form id="bookForm">


                        <div class="mb-3">

                            <label class="form-label">
                                Book Title
                            </label>

                            <input
                                type="text"
                                id="title"
                                class="form-control"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Author
                            </label>

                            <input
                                type="text"
                                id="author"
                                class="form-control"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Subject
                            </label>

                            <input
                                type="text"
                                id="subject"
                                class="form-control"
                                placeholder="Example: Java, Python, DBMS">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Book Condition
                            </label>

                            <select
                                id="condition"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Condition
                                </option>

                                <option value="New">
                                    New
                                </option>

                                <option value="Like New">
                                    Like New
                                </option>

                                <option value="Good">
                                    Good
                                </option>

                                <option value="Used">
                                    Used
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

    <label class="form-label">
        I am
    </label>

    <select
        id="senderType"
        class="form-select"
        required>

        <option value="">
            Select who you are
        </option>

        <option value="Student">
            Student
        </option>

        <option value="Ex-Student">
            Ex-Student
        </option>

        <option value="External Person">
            External Person
        </option>

        <option value="Institution / College">
            Institution / College
        </option>

        <option value="Library">
            Library
        </option>

    </select>

</div>


<div class="mb-3">

    <label class="form-label">
        Transaction Type
    </label>

    <select
        id="transactionType"
        class="form-select"
        required>

        <option value="">
            Select transaction type
        </option>

        <option value="Sell">
            Sell
        </option>

        <option value="Exchange">
            Exchange
        </option>

        <option value="Donate">
            Donate
        </option>

    </select>

</div>


<div class="mb-3">

    <label class="form-label">
        I want to give it to
    </label>

    <select
        id="recipientType"
        class="form-select"
        required>

        <option value="">
            Select recipient
        </option>

        <option value="Student">
            Student
        </option>

        <option value="Ex-Student">
            Ex-Student
        </option>

        <option value="External Person">
            External Person
        </option>

        <option value="Institution / College">
            Institution / College
        </option>

        <option value="Library">
            Library
        </option>

    </select>

</div>

<!-- Sell Details -->
<div id="sellDetails" style="display:none;">
    <div class="mb-3">
        <label class="form-label">Selling Price (₹)</label>
        <input type="number" id="price" class="form-control" min="0" placeholder="Enter price">
    </div>
</div>

<!-- Exchange Details -->
<div id="exchangeDetails" style="display:none;">
    <div class="mb-3">
        <label class="form-label">Book You Want in Exchange</label>
        <input type="text" id="wantedBookTitle" class="form-control"
               placeholder="Enter desired book title">
    </div>

    <div class="mb-3">
        <label class="form-label">Exchange Details</label>
        <textarea id="wantedBookDetails" class="form-control" rows="2"
                  placeholder="Optional details about the book you want"></textarea>
    </div>
</div>

<!-- Contact -->
<div class="mb-3">
    <label class="form-label">WhatsApp Number (Optional)</label>
    <input type="tel" id="contactPhone" class="form-control"
           placeholder="Enter WhatsApp number">
</div>




                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                id="description"
                                class="form-control"
                                rows="4"
                                placeholder="Mention useful details about the book...">
                            </textarea>

                        </div>


                        <button
                            class="btn btn-primary w-100">

                            List Book

                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script src="../js/firebase-config.js"></script>


<script>

auth.onAuthStateChanged(function(user) {

    if (!user) {

        window.location.href =
            "login.html";

    }

});


document
    .getElementById("bookForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();


        const user =
            auth.currentUser;


        if (!user) {

            alert("Please login first.");

            return;

        }


        try {

           await db.collection("exchangeBooks").add({
    title: document.getElementById("title").value.trim(),
    author: document.getElementById("author").value.trim(),
    subject: document.getElementById("subject").value.trim(),
    condition: document.getElementById("condition").value,

    senderType: document.getElementById("senderType").value,
    transactionType: document.getElementById("transactionType").value,
    recipientType: document.getElementById("recipientType").value,

    exchangeType: document.getElementById("transactionType").value,

    price: document.getElementById("transactionType").value === "Sell"
        ? Number(document.getElementById("price").value)
        : null,

    wantedBookTitle: document.getElementById("transactionType").value === "Exchange"
        ? document.getElementById("wantedBookTitle").value.trim()
        : null,

    wantedBookDetails: document.getElementById("transactionType").value === "Exchange"
        ? document.getElementById("wantedBookDetails").value.trim()
        : null,

    contactPhone: document.getElementById("contactPhone").value.trim(),

    description: document.getElementById("description").value.trim(),

    ownerId: user.uid,
    ownerName: user.displayName,
    ownerEmail: user.email,

    status: "available",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
});


            alert(
                "Your book has been listed successfully!"
            );


            window.location.href =
                "marketplace.html";

        }

        catch(error) {

            console.error(error);

            alert(
                "Unable to list book: " +
                error.message
            );

        }

    });
const transactionType = document.getElementById("transactionType");
const sellDetails = document.getElementById("sellDetails");
const exchangeDetails = document.getElementById("exchangeDetails");

transactionType.addEventListener("change", function () {

    sellDetails.style.display = "none";
    exchangeDetails.style.display = "none";

    if (this.value === "Sell") {
        sellDetails.style.display = "block";
    }

    if (this.value === "Exchange") {
        exchangeDetails.style.display = "block";
    }
});

const senderType = document.getElementById("senderType");
const recipientType = document.getElementById("recipientType");

function updateOptions() {

    Array.from(recipientType.options).forEach(option => {
        option.disabled = false;
    });

}
senderType.addEventListener("change", updateOptions);
transactionType.addEventListener("change", updateOptions);
</script>

</body>

</html>
