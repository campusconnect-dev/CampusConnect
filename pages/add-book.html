<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>List Book - CampusConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>


<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="../index.html">

            📚 CampusConnect

        </a>

        <a href="marketplace.html"
           class="btn btn-light btn-sm">

            Back to Exchange

        </a>

    </div>

</nav>


<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <h3 class="mb-4">
                        📕 List Your Book
                    </h3>


                    <form id="bookForm">


                        <div class="mb-3">

                            <label class="form-label">
                                Book Title
                            </label>

                            <input
                                type="text"
                                id="title"
                                class="form-control"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Author
                            </label>

                            <input
                                type="text"
                                id="author"
                                class="form-control"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Subject
                            </label>

                            <input
                                type="text"
                                id="subject"
                                class="form-control"
                                placeholder="Example: Java, Python, DBMS">

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Book Condition
                            </label>

                            <select
                                id="condition"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Condition
                                </option>

                                <option value="New">
                                    New
                                </option>

                                <option value="Like New">
                                    Like New
                                </option>

                                <option value="Good">
                                    Good
                                </option>

                                <option value="Used">
                                    Used
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Exchange Type
                            </label>

                            <select
                                id="exchangeType"
                                class="form-select"
                                required>

                                <option value="Exchange">
                                    Exchange for another book
                                </option>

                                <option value="Free">
                                    Give away for free
                                </option>

                                <option value="Sell">
                                    Sell
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                id="description"
                                class="form-control"
                                rows="4"
                                placeholder="Mention useful details about the book...">
                            </textarea>

                        </div>


                        <button
                            class="btn btn-primary w-100">

                            List Book

                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script src="../js/firebase-config.js"></script>


<script>

auth.onAuthStateChanged(function(user) {

    if (!user) {

        window.location.href =
            "login.html";

    }

});


document
    .getElementById("bookForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();


        const user =
            auth.currentUser;


        if (!user) {

            alert("Please login first.");

            return;

        }


        try {

            await db
                .collection("exchangeBooks")
                .add({

                    title:
                        document
                            .getElementById("title")
                            .value
                            .trim(),

                    author:
                        document
                            .getElementById("author")
                            .value
                            .trim(),

                    subject:
                        document
                            .getElementById("subject")
                            .value
                            .trim(),

                    condition:
                        document
                            .getElementById("condition")
                            .value,

                    exchangeType:
                        document
                            .getElementById("exchangeType")
                            .value,

                    description:
                        document
                            .getElementById("description")
                            .value
                            .trim(),

                    ownerId:
                        user.uid,

                    ownerName:
                        user.displayName,

                    ownerEmail:
                        user.email,

                    status:
                        "available",

                    createdAt:
                        firebase.firestore.FieldValue.serverTimestamp()

                });


            alert(
                "Your book has been listed successfully!"
            );


            window.location.href =
                "marketplace.html";

        }

        catch(error) {

            console.error(error);

            alert(
                "Unable to list book: " +
                error.message
            );

        }

    });

</script>

</body>

</html>
